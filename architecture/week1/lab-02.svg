<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Тарифный калькулятор собран из политик</title>
  <desc id="desc">Базовая ставка проходит через коэффициенты зоны, времени и скидки, после чего формируется цена.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#174b3b"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#19382d}.box{fill:#fffefa;stroke:#47745e;stroke-width:3}.head{fill:#e6f0df}.line{stroke:#174b3b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <text x="600" y="78" text-anchor="middle" font-size="29" font-weight="700">Каждый тарифный шаг — отдельная заменяемая политика</text>
  <rect class="box" x="55" y="205" width="205" height="120" rx="18"/><rect class="head" x="55" y="205" width="205" height="54" rx="18"/><text x="157" y="241" text-anchor="middle" font-size="23" font-weight="700">BaseRate</text><text x="157" y="293" text-anchor="middle" font-size="20">100 KZT</text>
  <rect class="box" x="345" y="205" width="190" height="120" rx="18"/><rect class="head" x="345" y="205" width="190" height="54" rx="18"/><text x="440" y="241" text-anchor="middle" font-size="23" font-weight="700">ZonePolicy</text><text x="440" y="293" text-anchor="middle" font-size="20">× 1.30</text>
  <rect class="box" x="620" y="205" width="190" height="120" rx="18"/><rect class="head" x="620" y="205" width="190" height="54" rx="18"/><text x="715" y="241" text-anchor="middle" font-size="23" font-weight="700">TimePolicy</text><text x="715" y="293" text-anchor="middle" font-size="20">× 1.20</text>
  <rect class="box" x="895" y="205" width="190" height="120" rx="18"/><rect class="head" x="895" y="205" width="190" height="54" rx="18"/><text x="990" y="241" text-anchor="middle" font-size="21" font-weight="700">DiscountPolicy</text><text x="990" y="293" text-anchor="middle" font-size="20">× 0.50</text>
  <path class="line" d="M260 265H335"/><path class="line" d="M535 265H610"/><path class="line" d="M810 265H885"/><path class="line" d="M990 325V385"/>
  <rect class="box" x="830" y="385" width="320" height="105" rx="18"/><rect class="head" x="830" y="385" width="320" height="52" rx="18"/><text x="990" y="420" text-anchor="middle" font-size="23" font-weight="700">Расчёт тарифа</text><text x="990" y="465" text-anchor="middle" font-size="20">78 KZT · итоговая цена</text>
</svg>
