<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Диспетчер передаёт событие обработчикам</title>
  <desc id="desc">EventDispatcher получает событие поездки и передаёт его всем подписанным обработчикам по общему контракту.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#174b3b"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#19382d}.box{fill:#fffefa;stroke:#47745e;stroke-width:3}.head{fill:#e6f0df}.line{stroke:#174b3b;stroke-width:3;fill:none;marker-end:url(#arrow)}.bus{stroke:#789b58;stroke-width:3;fill:none}</style>
  <text x="600" y="55" text-anchor="middle" font-size="29" font-weight="700">Один издатель уведомляет всех подписчиков</text>
  <rect class="box" x="55" y="205" width="235" height="125" rx="18"/><rect class="head" x="55" y="205" width="235" height="56" rx="18"/><text x="172" y="243" text-anchor="middle" font-size="24" font-weight="700">RideEvent</text><text x="172" y="300" text-anchor="middle" font-size="19">card_id · fare</text>
  <rect class="box" x="390" y="185" width="300" height="165" rx="18"/><rect class="head" x="390" y="185" width="300" height="60" rx="18"/><text x="540" y="225" text-anchor="middle" font-size="25" font-weight="700">EventDispatcher</text><text x="540" y="290" text-anchor="middle" font-size="20">subscribe(handler)</text><text x="540" y="324" text-anchor="middle" font-size="20">dispatch(event)</text>
  <rect class="box" x="810" y="75" width="330" height="105" rx="18"/><rect class="head" x="810" y="75" width="330" height="48" rx="18"/><text x="975" y="108" text-anchor="middle" font-size="22" font-weight="700">AuditHandler</text><text x="975" y="151" text-anchor="middle" font-size="18">записывает аудит</text>
  <rect class="box" x="810" y="225" width="330" height="105" rx="18"/><rect class="head" x="810" y="225" width="330" height="48" rx="18"/><text x="975" y="258" text-anchor="middle" font-size="22" font-weight="700">ScreenHandler</text><text x="975" y="301" text-anchor="middle" font-size="18">обновляет экран</text>
  <rect class="box" x="810" y="375" width="330" height="105" rx="18"/><rect class="head" x="810" y="375" width="330" height="48" rx="18"/><text x="975" y="408" text-anchor="middle" font-size="22" font-weight="700">MetricsHandler</text><text x="975" y="451" text-anchor="middle" font-size="18">считает поездки</text>
  <path class="line" d="M290 267H380"/><path class="bus" d="M745 128V428"/><path class="line" d="M690 267H745"/><path class="line" d="M745 128H800"/><path class="line" d="M745 267H800"/><path class="line" d="M745 428H800"/>
  <text x="600" y="530" text-anchor="middle" font-size="20" fill="#47745e">Новый обработчик добавляется подпиской, диспетчер не меняется</text>
</svg>
