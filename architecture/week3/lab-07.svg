<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Adapter в локальной оплате поездки</title>
  <desc id="desc">TransitTerminal вызывает PaymentPort. LocalGatewayAdapter реализует порт и преобразует сумму для FictionalGateway.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#51447e"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#25213a}.box{fill:#fbfaff;stroke:#6d5bb5;stroke-width:3}.head{fill:#e9e6f3}.line{stroke:#51447e;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style>
  <rect class="box" x="60" y="145" width="270" height="190" rx="16"/><rect class="head" x="60" y="145" width="270" height="60" rx="16"/><text x="195" y="184" text-anchor="middle" font-size="25" font-weight="700">TransitTerminal</text><text x="90" y="250" font-size="20">tap(request)</text><text x="90" y="290" font-size="18">сценарий</text>
  <rect class="box" x="440" y="145" width="300" height="190" rx="16"/><rect class="head" x="440" y="145" width="300" height="60" rx="16"/><text x="590" y="184" text-anchor="middle" font-size="24" font-weight="700">PaymentPort</text><text x="470" y="250" font-size="20">charge(request)</text><text x="470" y="290" font-size="18">общий контракт</text>
  <rect class="box" x="850" y="145" width="300" height="190" rx="16"/><rect class="head" x="850" y="145" width="300" height="60" rx="16"/><text x="1000" y="184" text-anchor="middle" font-size="23" font-weight="700">LocalGatewayAdapter</text><text x="880" y="250" font-size="19">тенге × 100 → тиыны</text><text x="880" y="290" font-size="18">ответ → PaymentResult</text>
  <rect class="box" x="850" y="400" width="300" height="115" rx="16"/><text x="1000" y="445" text-anchor="middle" font-size="23" font-weight="700">FictionalGateway</text><text x="1000" y="485" text-anchor="middle" font-size="18">локальная заглушка</text>
  <path class="line" d="M330 240H425"/><path class="line dash" d="M740 240H835"/><path class="line" d="M1000 335V390"/>
  <text x="600" y="560" text-anchor="middle" font-size="20" fill="#51447e">Никакой сетевой или платёжной операции</text>
</svg>
