<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Adapter, Decorator и Facade</title>
  <desc id="desc">Терминал использует порт оплаты. Декоратор оборачивает тот же порт, а адаптер переводит запрос для вымышленного шлюза.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#51447e"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#25213a}.box{fill:#fbfaff;stroke:#6d5bb5;stroke-width:3}.head{fill:#e9e6f3}.line{stroke:#51447e;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 8}</style>
  <rect class="box" x="60" y="130" width="300" height="190" rx="16"/><rect class="head" x="60" y="130" width="300" height="62" rx="16"/><text x="210" y="170" text-anchor="middle" font-size="26" font-weight="700">«protocol» PaymentPort</text><text x="88" y="235" font-size="22">+ charge(request)</text><text x="88" y="275" font-size="20">→ PaymentResult</text>
  <rect class="box" x="450" y="130" width="300" height="190" rx="16"/><rect class="head" x="450" y="130" width="300" height="62" rx="16"/><text x="600" y="170" text-anchor="middle" font-size="25" font-weight="700">LocalGatewayAdapter</text><text x="478" y="235" font-size="21">«реализует» порт</text><text x="478" y="275" font-size="20">тенге → тиыны</text>
  <rect class="box" x="840" y="130" width="300" height="190" rx="16"/><rect class="head" x="840" y="130" width="300" height="62" rx="16"/><text x="990" y="170" text-anchor="middle" font-size="25" font-weight="700">FictionalGateway</text><text x="870" y="235" font-size="21">локальный словарь</text><text x="870" y="275" font-size="20">одобрено / отказ</text>
  <rect class="box" x="60" y="420" width="300" height="170" rx="16"/><rect class="head" x="60" y="420" width="300" height="60" rx="16"/><text x="210" y="460" text-anchor="middle" font-size="25" font-weight="700">TransitFacade</text><text x="88" y="525" font-size="21">+ tap(route, amount)</text><text x="88" y="560" font-size="20">один вход в сценарий</text>
  <rect class="box" x="450" y="420" width="300" height="170" rx="16"/><rect class="head" x="450" y="420" width="300" height="60" rx="16"/><text x="600" y="460" text-anchor="middle" font-size="25" font-weight="700">CountingDecorator</text><text x="478" y="525" font-size="21">оборачивает порт</text><text x="478" y="560" font-size="20">считает вызовы</text>
  <path class="line" d="M360 225H435"/><path class="line" d="M750 225H825"/><path class="line" d="M360 505H435"/><path class="line dash" d="M600 420V335Q600 310 600 325"/>
  <text x="600" y="645" text-anchor="middle" font-size="20" fill="#51447e">Зависимость идёт к контракту · сетевого вызова нет</text>
</svg>
